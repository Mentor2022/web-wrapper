name: Build customer app

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission id (16 hex characters)
        required: true
      app_name:
        required: true
      app_url:
        required: true
      app_id:
        description: Android package id
        required: true
      icon_url:
        description: Signed link to the customer's icon
        required: true
      firebase_url:
        description: Signed link to google-services.json (optional)
        required: false
        default: ''
      app_permissions:
        description: Comma-separated permissions the customer chose (notifications,camera,microphone,location,vibrate)
        required: false
        default: notifications
      logo_url:
        description: Signed link to the customer's logo (optional)
        required: false
        default: ''
      config_json:
        description: App settings as JSON (colors, lock). Written into the app during the build.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Values are passed through env, never pasted into shell commands
    env:
      SUB_ID: ${{ inputs.submission_id }}
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ inputs.app_id }}
      ICON_URL: ${{ inputs.icon_url }}
      FIREBASE_URL: ${{ inputs.firebase_url }}
      APP_PERMS: ${{ inputs.app_permissions }}
      CONFIG_JSON: ${{ inputs.config_json }}
      LOGO_URL: ${{ inputs.logo_url }}
    steps:
      - name: Check inputs
        run: |
          [[ "$SUB_ID" =~ ^[0-9a-f]{16}$ ]] || { echo "bad submission id"; exit 1; }
          [[ "$APP_ID" =~ ^com\.wrapped\.a[0-9a-f]{8}$ ]] || { echo "bad app id"; exit 1; }
          printf '%s' "$APP_URL" | perl -ne 'exit 1 unless m{\Ahttps://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/%?=&#:+-]*)?\z}' \
            || { echo "bad url"; exit 1; }
          printf '%s' "$APP_NAME" | perl -CS -ne 'exit 1 unless /\A[\p{L}\p{N} .,\-]{2,30}\z/' \
            || { echo "bad app name"; exit 1; }
          [[ "$ICON_URL" == https://* ]] || { echo "bad icon url"; exit 1; }
          [[ -z "$LOGO_URL" || "$LOGO_URL" == https://* ]] || { echo "bad logo url"; exit 1; }
          [[ "$APP_PERMS" =~ ^[a-z,]*$ ]] || { echo "bad permissions"; exit 1; }

      - name: Check app settings
        run: |
          if [ -z "$CONFIG_JSON" ]; then CONFIG_JSON='{"v":1,"theme":{"primary":"#00897B","splash":"#FFFFFF","bg":"#FFFFFF"}}'; fi
          ICONS='["home","search","shop","user","info","help","phone","mail","chat","heart","star","bell","map","menu","grid","calendar","play","book","wallet"]'
          printf '%s' "$CONFIG_JSON" | jq -e --argjson icons "$ICONS" '
            (.v == 1) and
            ([.theme.primary, .theme.splash, .theme.bg] | all(type == "string" and test("^#[0-9A-Fa-f]{6}$"))) and
            ((.offline_title // "") | type == "string" and length <= 60) and
            ((.offline_msg // "") | type == "string" and length <= 160) and
            ((.rate_url // "") | type == "string" and (. == "" or test("^https://[^[:space:]\"]+$")) and length <= 300) and
            ((.shortcuts // []) | length <= 4 and all(.[];
               (.label | type == "string" and length >= 1 and length <= 25) and
               (.url | type == "string" and test("^https://[^[:space:]\"]+$")))) and
            ((.tabs // []) | (length == 0 or (length >= 2 and length <= 5)) and all(.[];
               (.label | type == "string" and length >= 1 and length <= 14) and
               (.url | type == "string" and test("^https://[^[:space:]\"]+$")) and
               (.icon as $i | $icons | index($i) != null)))
          ' >/dev/null || { echo "bad config_json"; exit 1; }
          # keep only the keys we know, so nothing else can reach the app
          printf '%s' "$CONFIG_JSON" | jq -c '{v: 1, theme: {primary: .theme.primary, splash: .theme.splash, bg: .theme.bg}, lock: (.lock == true), pull: (.pull != false), offline_title: (.offline_title // ""), offline_msg: (.offline_msg // ""), tabs: [(.tabs // [])[] | {label, url, icon}], exit_confirm: (.exit_confirm == true), rate_url: (.rate_url // ""), shortcuts: [(.shortcuts // [])[] | {label, url}]}' > "$RUNNER_TEMP/config.json"
          cat "$RUNNER_TEMP/config.json"

      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o "$(ls *.zip | head -1)" -d extracted

      - name: Apply permissions
        run: |
          MF=extracted/WebWrapper/app/src/main/AndroidManifest.xml
          LINES=""
          perm() { LINES+="    <uses-permission android:name=\"android.permission.$1\" />"$'\n'; }
          feat() { LINES+="    <uses-feature android:name=\"$1\" android:required=\"false\" />"$'\n'; }
          IFS=',' read -ra P <<< "$APP_PERMS"
          for p in "${P[@]}"; do
            case "$p" in
              notifications) perm POST_NOTIFICATIONS ;;
              camera) perm CAMERA; feat android.hardware.camera ;;
              microphone) perm RECORD_AUDIO; perm MODIFY_AUDIO_SETTINGS; feat android.hardware.microphone ;;
              location) perm ACCESS_COARSE_LOCATION; perm ACCESS_FINE_LOCATION; feat android.hardware.location; feat android.hardware.location.gps ;;
              vibrate) perm VIBRATE ;;
              "") ;;
              *) echo "unknown permission: $p"; exit 1 ;;
            esac
          done
          grep -q 'APP_PERMISSIONS' "$MF" || { echo "manifest marker missing"; exit 1; }
          LINES="$LINES" perl -0pi -e 's/[ \t]*<!-- APP_PERMISSIONS -->\n?/$ENV{LINES}/' "$MF"
          grep -n 'uses-' "$MF"

      - name: Apply app settings
        run: |
          APP=extracted/WebWrapper/app/src/main
          mkdir -p "$APP/assets"
          cp "$RUNNER_TEMP/config.json" "$APP/assets/config.json"
          SPLASH=$(jq -r '.theme.splash' "$RUNNER_TEMP/config.json")
          sed -i "s|<color name=\"splash_bg\">#[0-9A-Fa-f]*</color>|<color name=\"splash_bg\">$SPLASH</color>|" "$APP/res/values/colors.xml"
          grep -n splash_bg "$APP/res/values/colors.xml"

      - name: Prepare icon
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          curl -fsSL --max-time 60 --max-filesize 3000000 "$ICON_URL" -o icon.src
          identify "icon.src[0]" >/dev/null
          RES=extracted/WebWrapper/app/src/main/res
          rm -f "$RES/drawable/ic_fg.xml"
          mkdir -p "$RES/drawable-xxxhdpi"
          convert "icon.src[0]" -background none -resize 260x260 -gravity center -extent 432x432 "PNG32:$RES/drawable-xxxhdpi/ic_fg.png"

      - name: Add logo (optional)
        if: ${{ inputs.logo_url != '' }}
        run: |
          curl -fsSL --max-time 60 --max-filesize 3000000 "$LOGO_URL" -o logo.src
          identify "logo.src[0]" >/dev/null
          mkdir -p extracted/WebWrapper/app/src/main/assets
          convert "logo.src[0]" -background none -resize 800x400\> "PNG32:extracted/WebWrapper/app/src/main/assets/logo.png"

      - name: Add Firebase config (optional)
        if: ${{ inputs.firebase_url != '' }}
        run: |
          F=extracted/WebWrapper/app/google-services.json
          curl -fsSL --max-time 60 --max-filesize 300000 "$FIREBASE_URL" -o "$F"
          jq -e --arg id "$APP_ID" '.client[] | select(.client_info.android_client_info.package_name == $id)' "$F" >/dev/null \
            || { echo "google-services.json does not match $APP_ID"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n\t')
          K_ALIAS=$(printf '%s' "$K_ALIAS" | tr -d ' \r\n\t')
          K_PASS=$(printf '%s' "$K_PASS" | tr -d ' \r\n\t')
          [ -n "$KS_B64" ] || { echo "ERROR: secret KEYSTORE_BASE64 is empty or missing."; exit 1; }
          [ -n "$KS_PASS" ] || { echo "ERROR: secret KEYSTORE_PASSWORD is empty or missing."; exit 1; }
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null \
            || { echo "ERROR: KEYSTORE_BASE64 is not valid. Paste the WHOLE content of keystore_base64.txt again."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" >/dev/null 2>&1 \
            || { echo "ERROR: KEYSTORE_PASSWORD does not match KEYSTORE_BASE64. Both must come from the SAME github_secrets file."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$K_ALIAS" >/dev/null 2>&1 \
            || { echo "ERROR: KEY_ALIAS is wrong. It must be exactly the alias written in your github_secrets file."; exit 1; }
          echo "Signing key OK"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$K_ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and Play bundle
        working-directory: extracted/WebWrapper
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS (copy from here) ====="
          grep -n -E "^e: |What went wrong|Execution failed|Caused by|Could not|Unresolved|Manifest merger|error:" -A4 "$RUNNER_TEMP/build.log" | head -90 || true

      - name: Name the files
        run: |
          cp extracted/WebWrapper/app/build/outputs/apk/release/app-release.apk "$SUB_ID.apk"
          cp extracted/WebWrapper/app/build/outputs/bundle/release/app-release.aab "$SUB_ID.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ inputs.submission_id }}
          name: App ${{ inputs.submission_id }}
          make_latest: false
          files: |
            ${{ inputs.submission_id }}.apk
            ${{ inputs.submission_id }}.aab

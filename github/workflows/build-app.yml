name: Build customer app

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission id (16 hex characters)
        required: true
      app_name:
        required: true
      app_url:
        required: true
      app_id:
        description: Android package id
        required: true
      icon_url:
        description: Signed link to the customer's icon
        required: true
      firebase_url:
        description: Signed link to google-services.json (optional)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Values are passed through env, never pasted into shell commands
    env:
      SUB_ID: ${{ inputs.submission_id }}
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ inputs.app_id }}
      ICON_URL: ${{ inputs.icon_url }}
      FIREBASE_URL: ${{ inputs.firebase_url }}
    steps:
      - name: Check inputs
        run: |
          [[ "$SUB_ID" =~ ^[0-9a-f]{16}$ ]] || { echo "bad submission id"; exit 1; }
          [[ "$APP_ID" =~ ^com\.wrapped\.a[0-9a-f]{8}$ ]] || { echo "bad app id"; exit 1; }
          printf '%s' "$APP_URL" | perl -ne 'exit 1 unless m{\Ahttps://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/%?=&#:+-]*)?\z}' \
            || { echo "bad url"; exit 1; }
          printf '%s' "$APP_NAME" | perl -CS -ne 'exit 1 unless /\A[\p{L}\p{N} .,\-]{2,30}\z/' \
            || { echo "bad app name"; exit 1; }
          [[ "$ICON_URL" == https://* ]] || { echo "bad icon url"; exit 1; }

      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o "$(ls *.zip | head -1)" -d extracted

      - name: Prepare icon
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          curl -fsSL --max-time 60 --max-filesize 3000000 "$ICON_URL" -o icon.src
          identify "icon.src[0]" >/dev/null
          RES=extracted/WebWrapper/app/src/main/res
          rm -f "$RES/drawable/ic_fg.xml"
          mkdir -p "$RES/drawable-xxxhdpi"
          convert "icon.src[0]" -background none -resize 260x260 -gravity center -extent 432x432 "PNG32:$RES/drawable-xxxhdpi/ic_fg.png"

      - name: Add Firebase config (optional)
        if: ${{ inputs.firebase_url != '' }}
        run: |
          F=extracted/WebWrapper/app/google-services.json
          curl -fsSL --max-time 60 --max-filesize 300000 "$FIREBASE_URL" -o "$F"
          jq -e --arg id "$APP_ID" '.client[] | select(.client_info.android_client_info.package_name == $id)' "$F" >/dev/null \
            || { echo "google-services.json does not match $APP_ID"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: extracted/WebWrapper
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp extracted/WebWrapper/app/build/outputs/apk/release/app-release.apk "$SUB_ID.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ inputs.submission_id }}
          name: App ${{ inputs.submission_id }}
          make_latest: false
          files: ${{ inputs.submission_id }}.apk

